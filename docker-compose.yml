version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: identity_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: synthetic_identity_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: identity_backend
    restart: always
    environment:
      - DATABASE_URL=mysql+pymysql://root:rootpassword@db:3306/synthetic_identity_db
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./reports:/reports

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: identity_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
